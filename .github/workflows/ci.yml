# Action versions verified against the GitHub Releases API on 2026-10-14:
#   actions/checkout@v7            (latest release v7.0.1)
#   actions/setup-node@v7          (latest release v7.1.0)
#   actions/upload-artifact@v7     (latest release v7.0.2)
# Pinned to the latest released major tag that exists.
#
# This repository publishes the application, not the development test suite, so CI verifies what a
# clean checkout can verify: the types and a production build on a Linux runner. That still catches
# the things a local Windows run does not — platform-specific build failures and the Pages base path
# baked into the emitted asset URLs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7
